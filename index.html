<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Turkey Run: Muckleshoot Escape</title>
<style>
  html,body{margin:0;padding:0;background:#1a0a26;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Courier New',monospace;color:#ffd166;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;}
  #wrap{position:relative;}
  canvas{border:4px solid #b23a48;border-radius:8px;image-rendering:pixelated;max-width:96vw;max-height:calc(100vh - 90px);width:auto;height:auto;aspect-ratio:16/9;background:#000;display:block;}
  #hud{position:absolute;top:8px;left:12px;font-size:16px;text-shadow:2px 2px 0 #000;}
  #hint{margin-top:8px;font-size:13px;color:#f4a261;text-align:center;padding:0 8px;}
  #pad{display:none;position:fixed;left:0;right:0;bottom:0;height:26vh;min-height:110px;max-height:170px;padding:0 3vw calc(8px + env(safe-area-inset-bottom)) 3vw;justify-content:space-between;align-items:flex-end;pointer-events:none;}
  #pad .grp{display:flex;gap:3vw;pointer-events:auto;}
  .btn{width:16vw;max-width:88px;height:16vw;max-height:88px;border-radius:50%;background:rgba(178,58,72,.55);border:2px solid rgba(255,209,102,.8);color:#ffd166;font-size:min(9vw,44px);display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-tap-highlight-color:transparent;}
  .btn:active{background:rgba(255,209,102,.55);}
  #rotate{display:none;position:fixed;inset:0;background:rgba(13,2,33,.92);z-index:10;color:#ffd166;font-size:18px;text-align:center;padding-top:40vh;letter-spacing:1px;}
  @media (orientation:portrait) and (pointer:coarse){ #rotate{display:block;} }
  @media (pointer:coarse){ #pad{display:flex;} #keysHint{display:none;} #touchHint{display:inline;} }
  #touchHint{display:none;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="hud"></div>
</div>
<div id="hint"><span id="keysHint">Arrows / A-D move &nbsp;•&nbsp; Space / W / Up = jump (double-jump!) &nbsp;•&nbsp; P = pause &nbsp;•&nbsp; M = mute</span><span id="touchHint">Use the buttons to move &amp; jump (double-jump!) • tap screen to retry</span></div>
<div id="rotate">🔄 Rotate to landscape for the full casino 🦃</div>
<div id="pad">
  <div class="grp">
    <div class="btn" id="bL">◀</div><div class="btn" id="bR">▶</div>
  </div>
  <div class="grp">
    <div class="btn" id="bP">⏸</div><div class="btn" id="bJ">⤒</div>
  </div>
</div>
<script>
"use strict";
// ============ TURKEY RUN: MUCKSHOOT ESCAPE ============
// A Thanksgiving platformer. You are Gobbles, a turkey who wandered into
// the Muckleshoot Casino Resort the night before Thanksgiving. Reach the
// 2nd-floor arcade, grab coins, dodge chefs and pit bosses, escape!
const cvs = document.getElementById("game"), ctx = cvs.getContext("2d");
const W = cvs.width, H = cvs.height;
const GRAV = 1900, MOVE = 340, JUMP = 720, DJUMP = 640;
let muted = false, paused = false, t0 = Date.now();

// --- audio (WebAudio beeps, no assets needed) ---
let actx = null;
function beep(freq, dur=0.08, type="square", vol=0.15){
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch(e){}
}

// --- input ---
const keys = {};
addEventListener("keydown", e => {
  keys[e.code] = true;
  if (["Space","ArrowUp","KeyW"].includes(e.code)) e.preventDefault();
  if (e.code === "KeyP") paused = !paused;
  if (e.code === "KeyM") muted = !muted;
  if (e.code === "KeyR" && (state === "dead" || state === "win")) reset();
});
addEventListener("keyup", e => keys[e.code] = false);

// --- touch controls ---
function bindBtn(id, code){
  const el = document.getElementById(id);
  const on = ev => { ev.preventDefault(); keys[code] = true; };
  const off = ev => { ev.preventDefault(); keys[code] = false; };
  el.addEventListener("pointerdown", on);
  el.addEventListener("pointerup", off);
  el.addEventListener("pointercancel", off);
  el.addEventListener("pointerleave", off);
}
bindBtn("bL", "ArrowLeft"); bindBtn("bR", "ArrowRight");
bindBtn("bJ", "Space");
document.getElementById("bP").addEventListener("pointerdown", e => { e.preventDefault(); paused = !paused; });
// tap anywhere to restart after death/win
addEventListener("pointerdown", e => {
  if ((state === "dead" || state === "win") && !e.target.closest(".btn")) reset();
});

// --- level: platforms [x,y,w,h,type] type: 0 normal,1 slot-carpet(rubber),2 slot-machine-block,3 spike-oven ---
// Three sections: casino floor (b1), restaurant, 2nd-floor arcade. y grows downward.
const plats = [
  // section 1 - casino floor
  [0,500,520,40,0],[600,500,360,40,0],[1040,430,180,30,0],[1300,500,420,40,0],
  [560,380,140,24,1],[840,330,130,24,1],[1180,300,140,24,0],
  // slot machine obstacles (blocks)
  [520,436,80,64,2],[960,436,80,64,2],[1420,436,80,64,2],
  // section 2 - buffet + kitchen
  [1800,500,500,40,0],[2400,500,340,40,0],[2820,440,160,30,0],[3060,500,380,40,0],
  [2050,370,150,24,1],[2350,320,150,24,1],[2650,360,130,24,1],
  [2320,436,80,64,2],[2980,436,80,64,2],
  // kitchen ovens (spikes) + gap
  [3440,500,300,40,0],[3440,462,40,38,3],[3740,462,40,38,3],
  [3800,430,160,30,0],[4020,500,320,40,0],
  // section 3 - escalator to arcade (climb)
  [4400,500,400,40,0],[4700,420,140,24,1],[4860,340,140,24,1],[5020,260,160,24,1],
  [5240,260,420,40,0], // arcade floor!
  [5700,200,120,24,0],
];
const LEVEL_END = 6060;

// coins [x,y,taken]
let coins = [];
for (const c of [[600,340],[900,270],[1230,240],[1500,440],[1720,440],[2120,310],[2420,260],[2720,300],[3120,440],[3300,440],[3560,420],[3860,370],[4100,440],[4760,360],[4920,280],[5080,200],[5400,200],[5600,200],[5760,140]])
  coins.push({x:c[0],y:c[1],taken:false});

// enemies [x,y,range,speed,type] type: chef(red) walks+turns, pitboss(purple) faster
let enemies = [
  {x:1250,y:452,r:260,s:110,type:0},
  {x:1900,y:452,r:300,s:130,type:0},
  {x:2900,y:392,r:120,s:100,type:1},
  {x:3550,y:452,r:220,s:140,type:1},
  {x:4100,y:452,r:240,s:120,type:0},
  {x:5300,y:212,r:280,s:150,type:1},
].map(e => ({...e, x0:e.x, dir:1}));

// turkey
const P = {x:60,y:440,vx:0,vy:0,w:38,h:40,onGround:false,jumps:0,face:1,anim:0};
let camX = 0, state = "play", score = 0, deaths = 0, best = 0;
let msg = "", msgT = 0;

function reset(){
  Object.assign(P,{x:60,y:440,vx:0,vy:0,onGround:false,jumps:0,face:1});
  camX = 0; state = "play";
  coins.forEach(c => c.taken = false);
  enemies.forEach(e => {e.x = e.x0; e.dir = 1;});
  score = 0;
}

function aabb(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function update(dt){
  if (state !== "play" || paused) return;
  // input
  let mx = 0;
  if (keys.ArrowLeft||keys.KeyA) mx -= 1;
  if (keys.ArrowRight||keys.KeyD) mx += 1;
  P.vx = mx*MOVE;
  if (mx) { P.face = mx; P.anim += dt*10; }
  const jumpKey = keys.Space||keys.ArrowUp||keys.KeyW;
  if (jumpKey && !P.jumpHeld && P.jumps < 2){
    P.vy = -(P.jumps===0 ? JUMP : DJUMP);
    P.jumps++;
    beep(P.jumps===1?520:640,0.09,"square");
  }
  P.jumpHeld = jumpKey;

  P.vy += GRAV*dt;
  P.x += P.vx*dt; P.y += P.vy*dt;

  // collisions
  P.onGround = false;
  const box = {x:P.x,y:P.y,w:P.w,h:P.h};
  for (const p of plats){
    const r = {x:p[0],y:p[1],w:p[2],h:p[3],t:p[4]};
    if (!aabb(box,r)) continue;
    // resolve from top when falling
    if (P.vy >= 0 && (P.y+P.h) - P.vy*dt <= r.y + 4){
      P.y = r.y - P.h; P.vy = 0; P.onGround = true; P.jumps = 0;
      if (r.t === 1 && Math.random() < 0.9) beep(120,0.05,"sawtooth",0.05); // bouncy carpet thump
    } else if (P.vy < 0 && r.t === 2){ P.y = r.y + r.h; P.vy = 0; }
    else if (r.t === 2){ // side bump
      if (P.x + P.w/2 < r.x + r.w/2) P.x = r.x - P.w; else P.x = r.x + r.w;
      P.vx = 0;
    }
    box.x=P.x; box.y=P.y;
  }
  // spikes
  for (const p of plats){
    if (p[4]===3 && aabb({x:P.x,y:P.y,w:P.w,h:P.h},{x:p[0],y:p[1],w:p[2],h:p[3]})) die();
  }
  // coins
  for (const c of coins){
    if (!c.taken && Math.abs(c.x-(P.x+P.w/2))<26 && Math.abs(c.y-(P.y+P.h/2))<30){
      c.taken = true; score += 100; beep(880,0.07,"sine"); beep(1320,0.09,"sine");
    }
  }
  // enemies
  for (const e of enemies){
    e.x += e.dir*e.s*dt;
    if (e.x > e.x0+e.r) e.dir = -1;
    if (e.x < e.x0-e.r) e.dir = 1;
    if (aabb({x:P.x,y:P.y,w:P.w,h:P.h},{x:e.x,y:e.y,w:44,h:48})) die();
  }
  // fell in a gap
  if (P.y > H + 80) die();
  // win
  if (P.x > LEVEL_END){
    state = "win"; best = Math.max(best, score + 500);
    beep(660,0.12,"sine"); beep(880,0.12,"sine"); beep(1100,0.2,"sine");
    msg = "GOBBLES ESCAPED! Coin bonus +500";
  }
  // camera
  const target = Math.max(0, Math.min(P.x - W*0.4, plats[plats.length-1][0]+plats[plats.length-1][2] - W));
  camX += (target - camX) * Math.min(1, dt*6);
}

function die(){
  state = "dead"; deaths++;
  beep(200,0.3,"sawtooth",0.2); beep(150,0.4,"sawtooth",0.2);
  msg = "GOBBLED! Press R to try again";
}

// ---------- drawing ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function drawTurkey(x,y,face,walk,t){
  // body
  ctx.fillStyle="#b5651d"; rr(x,y+8,34,30,12); ctx.fill();
  // head
  ctx.fillStyle="#e07b39"; ctx.beginPath(); ctx.arc(x+(face>0?26:8), y+6, 9, 0, 7); ctx.fill();
  // beak + wattle
  ctx.fillStyle="#f4a261"; ctx.beginPath();
  ctx.moveTo(x+(face>0?34:0),y+4); ctx.lineTo(x+(face>0?42:-8),y+8); ctx.lineTo(x+(face>0?34:0),y+12); ctx.fill();
  ctx.fillStyle="#d62828"; ctx.beginPath(); ctx.arc(x+(face>0?26:8), y+14, 3.5, 0, 7); ctx.fill();
  // eye
  ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(x+(face>0?29:5), y+3, 3, 0, 7); ctx.fill();
  ctx.fillStyle="#000"; ctx.beginPath(); ctx.arc(x+(face>0?30:4), y+3, 1.5, 0, 7); ctx.fill();
  // tail fan
  ctx.fillStyle="#7f4f24";
  for (let i=-2;i<=2;i++){
    ctx.save(); ctx.translate(x+4, y+16); ctx.rotate(i*0.5 - (face>0?0.6:-0.6));
    ctx.fillRect(-3,-20,6,20); ctx.restore();
  }
  // legs
  const step = walk ? Math.sin(t*14)*5 : 0;
  ctx.strokeStyle="#e07b39"; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(x+10,y+37); ctx.lineTo(x+10+step,y+46); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+24,y+37); ctx.lineTo(x+24-step,y+46); ctx.stroke();
}
function drawChef(e,t){
  ctx.fillStyle="#fff"; rr(e.x,e.y,44,48,8); ctx.fill();
  ctx.fillStyle="#eee"; rr(e.x+6,e.y-10,32,12,4); ctx.fill();
  ctx.fillStyle="#d62828"; ctx.beginPath(); ctx.arc(e.x+22,e.y+14,7,0,7); ctx.fill(); // angry face
  ctx.fillStyle="#000"; ctx.fillRect(e.x+14,e.y+12,4,4); ctx.fillRect(e.x+26,e.y+12,4,4);
  ctx.fillStyle="#d62828"; ctx.fillRect(e.x+8,e.y+30,28,14); // apron
  ctx.fillStyle="#888"; ctx.fillRect(e.x+(e.dir>0?36:-8),e.y+20,8,6); // spatula
}
function drawPitboss(e){
  ctx.fillStyle="#4a148c"; rr(e.x,e.y,44,48,8); ctx.fill();
  ctx.fillStyle="#12005e"; ctx.fillRect(e.x,e.y,44,14);
  ctx.fillStyle="#ffd166"; ctx.beginPath(); ctx.arc(e.x+16,e.y+20,3,0,7); ctx.fill(); ctx.beginPath(); ctx.arc(e.x+28,e.y+20,3,0,7); ctx.fill();
  ctx.fillStyle="#fff"; ctx.font="bold 14px monospace"; ctx.fillText("§",e.x+18,e.y+40);
}
function drawSlot(x,y){
  ctx.fillStyle="#212529"; rr(x,y,80,64,6); ctx.fill();
  ctx.fillStyle="#ffd166"; ctx.fillRect(x+6,y+8,68,28);
  ctx.fillStyle="#d62828"; ctx.font="bold 20px monospace";
  ctx.fillText("7 7",x+20,y+30);
  ctx.fillStyle="#f4a261"; ctx.fillRect(x+30,y+44,20,10);
}
function draw(){
  // sky/wall gradient
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#2b1055"); g.addColorStop(1,"#0d0221");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // neon carpet hint (background stripes)
  ctx.globalAlpha=0.15;
  for (let i=0;i<20;i++){ctx.fillStyle=i%2?"#7b2cbf":"#e63946";ctx.fillRect(i*90-(camX*0.5)%180,0,45,H);}
  ctx.globalAlpha=1;

  ctx.save(); ctx.translate(-camX,0);

  // decorations: chandeliers / arcade signs
  for (let i=0;i<12;i++){
    const dx = 300+i*480;
    if (dx > camX-100 && dx < camX+W+100){
      if (i<8){ // chandelier
        ctx.fillStyle="#ffd166"; ctx.beginPath(); ctx.arc(dx,60,10,0,7); ctx.fill();
        ctx.strokeStyle="#ffd166"; ctx.beginPath(); ctx.moveTo(dx,0); ctx.lineTo(dx,50); ctx.stroke();
      } else { // arcade sign
        ctx.fillStyle="#00f5d4"; ctx.font="bold 26px monospace";
        ctx.fillText("ARCADE", dx, 100);
        ctx.fillStyle="#f72585"; ctx.fillText("★ ★ ★", dx+8, 130);
      }
    }
  }

  for (const p of plats){
    if (p[0]+p[2] < camX-50 || p[0] > camX+W+50) continue;
    if (p[4]===0){ ctx.fillStyle="#6d4c3d"; ctx.fillRect(p[0],p[1],p[2],p[4]||p[3]);
      ctx.fillStyle="#8d6e63"; ctx.fillRect(p[0],p[1],p[2],6); }
    else if (p[4]===1){ ctx.fillStyle="#e63946"; ctx.fillRect(p[0],p[1],p[2],p[3]);
      ctx.fillStyle="#f1faee"; for(let i=0;i<p[2];i+=18) ctx.fillRect(p[0]+i,p[1]+6,4,4); } // casino carpet
    else if (p[4]===2){ drawSlot(p[0],p[1]); }
    else if (p[4]===3){ ctx.fillStyle="#ff6b00"; for(let i=0;i<p[2];i+=10){ctx.beginPath();ctx.moveTo(p[0]+i,p[1]+p[3]);ctx.lineTo(p[0]+i+5,p[1]);ctx.lineTo(p[0]+i+10,p[1]+p[3]);ctx.fill();} }
  }
  // coins
  for (const c of coins){
    if (c.taken) continue;
    const bob = Math.sin(Date.now()/300+c.x)*4;
    ctx.fillStyle="#ffd166"; ctx.beginPath(); ctx.arc(c.x,c.y+bob,9,0,7); ctx.fill();
    ctx.fillStyle="#b8860b"; ctx.font="bold 10px monospace"; ctx.fillText("$",c.x-3,c.y+bob+4);
  }
  // finish door
  ctx.fillStyle="#00f5d4"; rr(LEVEL_END+40,140,80,120,8); ctx.fill();
  ctx.fillStyle="#000"; ctx.font="bold 16px monospace"; ctx.fillText("EXIT", LEVEL_END+52, 205);

  for (const e of enemies) e.type===0?drawChef(e):drawPitboss(e);
  drawTurkey(P.x,P.y,P.face,P.onGround&&Math.abs(P.vx)>10,Date.now()/1000);

  ctx.restore();

  // HUD
  document.getElementById("hud").textContent =
    "🪙 "+score + "   💀 " + deaths + (best?"   🏆 best "+best:"");
  if (state==="dead"){
    ctx.fillStyle="rgba(0,0,0,0.6)"; ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#ff6b6b"; ctx.font="bold 40px monospace"; ctx.fillText("GOBBLED!",W/2-120,H/2-20);
    ctx.fillStyle="#fff"; ctx.font="20px monospace"; ctx.fillText(msg,W/2-msg.length*5.5,H/2+20);
    ctx.fillStyle="#f4a261"; ctx.font="16px monospace"; ctx.fillText("tap / press R to retry",W/2-100,H/2+55);
  }
  if (state==="win"){
    ctx.fillStyle="rgba(0,40,0,0.6)"; ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#00f5d4"; ctx.font="bold 36px monospace"; ctx.fillText("HAPPY THANKSGIVING!",W/2-220,H/2-30);
    ctx.fillStyle="#fff"; ctx.font="20px monospace"; ctx.fillText("Gobbles made it to the arcade 🕹️ Score: "+(score+500),W/2-230,H/2+10);
    ctx.fillText("Press R to play again",W/2-110,H/2+45);
  }
  if (paused){
    ctx.fillStyle="rgba(0,0,0,0.5)"; ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#ffd166"; ctx.font="bold 30px monospace"; ctx.fillText("PAUSED",W/2-60,H/2);
  }
}

let last = Date.now();
function loop(){
  const now = Date.now();
  const dt = Math.min(0.033,(now-last)/1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
// roundRect polyfill for older browsers
if (!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r); this.arcTo(x,y,x+w,y,r); return this;
  };
}
loop();
</script>
</body>
</html>
